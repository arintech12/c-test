   # - name: Upload compiled binaries
   #   uses: actions/upload-artifact@v4
   #   if: github.event_name == 'push' 
   #   with:
   #     name: my-app-zip
   #     path: artifacts/my-app.zip
        
  test:
    runs-on: windows-latest
    needs: build

    steps:
    - uses: actions/checkout@v3

    - name: Run test
      run: ctest


        
