name: Build and Test C Project

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main  

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Conan
      run: choco install conan -y

    - name: Add Cppcheck to PATH
      run: |
        echo "C:\Program Files\conan" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

    - name: Install dependencies using Conan
      run: |
        refreshenv
        conan --version
      shell: pwsh
    
    - name: Install dependencies using Conan
      run: conan install . -pr=myprofile

    - name: Build with CMake
      run: |
        mkdir build
        cmake -S . -B build
        cmake --build ./build --config Debug --target MyProject -j 10 --

    - name: Run built executable
      run: |
        .\build\Debug\MyProject.exe
      shell: pwsh

    - name: Build with CMake
      run: |
        cmake --build ./build --config Debug --target tests -j 10 --

    #    ./build/MyProject
    #    cmake --build ./build --config Debug --target tests -j 10 --
    #    build/bin/tests --gtest_output=xml:output.xml

   # - name: Zip compiled binaries
